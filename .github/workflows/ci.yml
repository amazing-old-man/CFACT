name: CFACT package contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -c requirements/simulation-lock.txt '.[test,dev]'
      - run: ruff check src/cfact scripts tests
      - run: python -m pytest -q
      - run: python -m build

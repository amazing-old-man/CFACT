[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfact"
version = "0.7.1.dev0"
description = "Physical counterfactual action-tree construction and data access"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.23,<3", "h5py>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
collect = ["scipy>=1.11,<2", "mujoco>=3.2,<4", "Pillow>=9,<12", "imageio>=2.30,<3"]
download = ["huggingface_hub>=0.34,<2", "httpx[socks]>=0.28,<1"]
input = ["pandas>=2,<3", "pyarrow>=14", "PyYAML>=6,<7"]
test = ["pytest>=8,<9", "scipy>=1.11,<2", "mujoco>=3.2,<4", "Pillow>=9,<12", "imageio>=2.30,<3", "pandas>=2,<3", "pyarrow>=14", "PyYAML>=6,<7"]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
cfact = "cfact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfact = ["viewer/*.html", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["simulator: requires pinned simulator source and assets"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

<!doctype html><html lang="zh"><meta charset="utf-8"><title>CFACT · Trees & LeRobot</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f7fa;color:#162235}select,button{padding:8px;margin:4px;border:1px solid #aab5c3;border-radius:5px}main{display:grid;grid-template-columns:360px 1fr;gap:24px}section{background:white;padding:18px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}video{width:100%;max-height:480px;background:#111}details{margin:12px 0}a{color:#185fa1}summary{cursor:pointer}#edges button{display:block;text-align:left;width:95%}</style>
<h1>CFACT 数据浏览</h1><p>任务 → 源示范 → 反事实树 → 同父动作。训练图像与完整审阅视频分别保存。</p>
<label>Task <select id="task"></select></label><label>Demo <select id="demo"></select></label><label>Root <select id="root"></select></label>
<p id="status"></p><main><section><div id="source"></div><div id="edges"></div><details><summary>真实谱系回看</summary><div id="lineages"></div></details></section>
<section><h2 id="title">选择动作</h2><video id="video" controls></video><div id="links"></div>
<label>片段<select id="segment"><option>local</option><option>fixed_continuation</option></select></label><label>状态索引<input id="step" type="number" min="0" value="0"></label><button id="read">读取实测数组</button><pre id="arrays"></pre>
<details open><summary>结果标签</summary><pre id="result"></pre></details><details><summary>LeRobot episode 与终态映射</summary><pre id="mapping"></pre></details><details><summary>动作定义</summary><pre id="option"></pre></details></section></main>
<script>
const $=id=>document.getElementById(id);let roots=[],selected=null,playlist=[],part=0;
const file=p=>'/file?path='+encodeURIComponent(p);const api=async p=>{let r=await fetch(p),j=await r.json();if(!r.ok)throw Error(j.error);return j};
function options(id,values){$(id).replaceChildren(...values.map(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;return o}))}
function link(label,path){let a=document.createElement('a');a.textContent=label;a.href=file(path);a.target='_blank';a.style.marginRight='12px';return a}
function fail(e){$('status').textContent=e.message}
function tasks(){options('task',[...new Set(roots.map(r=>r.task))].map(x=>[x,x]));demos()}
function demos(){let rs=roots.filter(r=>r.task===$('task').value);options('demo',[...new Set(rs.map(r=>r.source_id))].map(s=>[s,rs.find(r=>r.source_id===s).demo_id+' · '+s.slice(-8)]));rootOptions()}
function rootOptions(){options('root',roots.filter(r=>r.source_id===$('demo').value).map(r=>[r.root_id,r.root_id]));tree().catch(fail)}
async function tree(){resetVideo();selected=null;for(const id of ['arrays','result','mapping','option','links'])$(id).textContent='';$('title').textContent='选择动作';const t=await api('/api/tree?root_id='+$('root').value);$('status').textContent=t.status+' · '+t.nodes.length+' nodes · '+t.edges.length+' edges';$('edges').replaceChildren();$('source').replaceChildren(link('源示范记录',t.source_manifest),link('根上下文',t.root_context));
 const source=await api(file(t.source_manifest)),original=await api(file(source.original_video));$('source').append(document.createTextNode(' '+original.status));for(const v of original.videos){let b=document.createElement('button');b.textContent='源视频 '+(v.camera||'camera');b.onclick=()=>{resetVideo();$('video').src=file(v.path)};$('source').append(b)}
 for(const n of t.nodes){let es=t.edges.filter(e=>e.parent_node===n.node_id);if(!es.length)continue;let d=document.createElement('details');d.open=n.node_id===t.root_node;let s=document.createElement('summary');s.textContent=n.node_id;d.append(s);for(const e of es){let b=document.createElement('button');b.textContent=(e.generator||'Unexecuted')+' · '+(e.operation_type||'')+' · '+e.edge_id.slice(-8);b.onclick=()=>edge(e.edge_id).catch(fail);d.append(b)}$('edges').append(d)}
 let lines=(await (await fetch(file('mappings/lineage_paths.jsonl'))).text()).trim().split('\n').filter(Boolean).map(JSON.parse).filter(x=>x.root_id===t.root_id);$('lineages').replaceChildren();for(const l of lines){let b=document.createElement('button');b.textContent=l.lineage_id;b.onclick=()=>{playlist=l.segments;part=0;playPart()};$('lineages').append(b)}}
async function edge(id){const e=await api('/api/edge?edge_id='+id);selected=e;resetVideo();$('title').textContent=e.generator+' · '+e.edge_id;$('result').textContent=JSON.stringify(e.result,null,2);$('option').textContent=JSON.stringify(e.option,null,2);$('mapping').textContent=JSON.stringify({episodes:e.episodes,terminals:e.terminals},null,2);$('links').replaceChildren();if(!e.media.review_video)$('links').textContent='审阅视频缺失；可查看下方实测数组与终态图像。';if(e.media.review_video){$('video').src=file(e.media.review_video);$('links').append(link('完整审阅视频',e.media.review_video))}for(const t of e.terminals){$('links').append(link(t.segment+' 原始数组',t.trace_path));for(const [c,p]of Object.entries(t.terminal_images||{}))$('links').append(link(t.segment+' 终态 '+c,p))}$('step').value=0;await arrays()}
async function arrays(){if(!selected)return;const a=await api('/api/arrays?edge_id='+selected.edge_id+'&segment='+$('segment').value+'&index='+$('step').value);$('arrays').textContent=JSON.stringify(a,null,2);$('step').max=a.K}
function resetVideo(){playlist=[];part=0;$('video').pause();$('video').onloadedmetadata=null;$('video').removeAttribute('src');$('video').load()}
function playPart(){if(part>=playlist.length)return;let p=playlist[part];$('video').src=file(p.video);$('video').onloadedmetadata=()=>{$('video').currentTime=p.start_s;$('video').play().catch(fail)}}
$('video').onended=()=>{if($('video').ended&&playlist.length&&part<playlist.length){part++;playPart()}};
$('video').ontimeupdate=()=>{if(playlist.length&&part<playlist.length&&$('video').currentTime>=playlist[part].end_s){$('video').pause();part++;playPart()}};
$('task').onchange=demos;$('demo').onchange=rootOptions;$('root').onchange=()=>tree().catch(fail);$('read').onclick=()=>arrays().catch(fail);api('/api/roots').then(x=>{roots=x.roots;tasks()}).catch(fail);
</script></html>
